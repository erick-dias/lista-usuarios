<div class="layout">
  <mat-toolbar class="toolbar">
    <button mat-icon-button aria-label="Menu">
      <mat-icon>menu</mat-icon>
    </button>

    <span class="toolbar-title">USUÁRIOS</span>

    <div class="search-box">
      <mat-icon class="search-icon">search</mat-icon>
      <input
        class="search-input"
        [formControl]="searchControl"
        placeholder="Pesquisar..."
        aria-label="Pesquisar usuários"
      />
    </div>

    <span class="flex-spacer"></span>
  </mat-toolbar>

  <main class="content">
    <p class="section-label">Usuários cadastrados</p>

    @if (loading()) {
      <div class="state-container">
        <mat-spinner diameter="40" />
      </div>
    } @else if (error()) {
      <div class="state-container error-msg">
        <mat-icon>error_outline</mat-icon>
        <span>{{ error() }}</span>
      </div>
    } @else if (users().length === 0) {
      <div class="state-container">
        <span>Nenhum usuário encontrado.</span>
      </div>
    } @else {
      <div class="user-list">
        @for (user of users(); track user.id) {
          <div class="user-row">
            <mat-icon class="avatar-icon">account_circle</mat-icon>
            <span class="user-name">{{ user.name }}</span>
            <span class="user-email">{{ user.email }}</span>
            <button mat-icon-button class="edit-btn" aria-label="Editar usuário">
              <mat-icon>edit</mat-icon>
            </button>
          </div>
        }
      </div>
    }
  </main>

  <button mat-fab class="fab" aria-label="Adicionar usuário">
    <mat-icon>add</mat-icon>
  </button>
</div>
